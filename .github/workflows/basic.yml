name: Lab 7 - SCA Basic

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'lab7-sca-python'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --format JSON
            --enableExperimental
            --prettyPrint

      - name: Verify generated reports
        run: |
          ls -lh reports/
          test -s reports/dependency-check-report.html
          test -s reports/dependency-check-report.json

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports-basic
          path: reports/
          if-no-files-found: warn
          retention-days: 7
