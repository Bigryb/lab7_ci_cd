name: Lab 7 - SCA Intermediate

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: '27 4 * * *'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  sca-analysis:
    name: SCA Analysis and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'lab7-sca-python'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --format JSON
            --format SARIF
            --enableExperimental
            --prettyPrint

      - name: Verify generated reports
        run: |
          test -s reports/dependency-check-report.html
          test -s reports/dependency-check-report.json
          test -s reports/dependency-check-report.sarif

      - name: Upload SCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports-intermediate
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload SARIF to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-sca

      - name: Check Quality Gate
        run: |
          python3 check_sca_gate.py reports/dependency-check-report.json
